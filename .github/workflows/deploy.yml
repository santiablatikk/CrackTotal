name: Deploy production

# Production only tracks `main`.
# Pushing a feature branch does NOT deploy cracktotal.com by itself.
# Legacy Mi Carrera auto-promotion has been retired.
#
# Fetch origin never deploys — it only downloads remotes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate + deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: '[prod-1] Checkout main'
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: '[prod-2] Validate deploy surface'
        run: |
          echo "[prod-2] Validating production candidate"
          npm run validate
          echo "[prod-2] Validation passed"

      - name: '[prod-2b] Run full release tests'
        run: |
          npm ci
          npm test

      - name: '[prod-3] Request Render deployment'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not configured. Waiting for Render auto-deploy on main instead."
          else
            echo "[prod-3] Triggering Render deployment for main"
            curl --fail-with-body --show-error --silent --max-time 30 -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
            echo "[prod-3] Render accepted the deploy request; awaiting actual live commit."
          fi

      - name: '[prod-4] Confirm exact production commit'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://cracktotal.com/__ct_release/health"
          for attempt in $(seq 1 30); do
            reply="$(curl -fsSL --max-time 12 --connect-timeout 7 \
              -H 'Cache-Control: no-cache' \
              "${URL}?expected=${EXPECTED_SHA}" 2>/dev/null || true)"
            if printf '%s' "$reply" | jq -e --arg sha "$EXPECTED_SHA" \
              '.service == "cracktotal" and .version == "5.1.0" and .environment == "production" and .branch == "main" and .commit == $sha' \
              >/dev/null 2>&1; then
              echo "[prod-4] Verified live commit: $EXPECTED_SHA"
              echo "[prod-4] Render production serves the intended 5.1 release."
              exit 0
            fi
            echo "[prod-4] Live commit not verified (attempt $attempt/30)."
            if [ "$attempt" -lt 30 ]; then sleep 15; fi
          done
          echo "::error::Production commit could not be verified. Check Render deploy history, branch, hook/auto-deploy, Cloudflare and site reachability."
          exit 1
