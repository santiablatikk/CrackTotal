name: Deploy production

# Production only tracks `main`.
# Pushing a feature branch does NOT deploy cracktotal.com by itself.
# Legacy Mi Carrera auto-promotion has been retired.
#
# Fetch origin never deploys — it only downloads remotes.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate + deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: '[prod-1] Checkout main'
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: '[prod-2] Validate deploy surface'
        run: |
          echo "[prod-2] Validating production candidate"
          npm run validate
          echo "[prod-2] Validation passed"

      - name: '[prod-2b] Run full release tests'
        run: |
          npm ci
          npm test

      - name: '[prod-3] Confirm existing Render auto-deploy is configured'
        run: |
          echo "[prod-3] Production Static Site auto-deploy tracks main."
          echo "[prod-3] No webhook is invoked: a push to main already triggers Render."
          echo "[prod-3] The next gate verifies the exact public build, not only the GitHub merge."

      - name: '[prod-4] Confirm exact production commit'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          URL="https://cracktotal.com/__ct_release.json"
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            reply="$(curl -fsSL --max-time 12 --connect-timeout 7 \
              -H 'Cache-Control: no-cache' \
              "${URL}?expected=${EXPECTED_SHA}" 2>/dev/null || true)"
            if printf '%s' "$reply" | jq -e --arg sha "$EXPECTED_SHA" --arg version "$EXPECTED_VERSION" \
              '.service == "cracktotal-static" and .version == $version and .branch == "main" and .commit == $sha' \
              >/dev/null 2>&1; then
              echo "[prod-4] Verified live commit: $EXPECTED_SHA"
              echo "[prod-4] Render static production serves the intended release."
              exit 0
            fi
            echo "[prod-4] Live commit not verified (attempt $attempt/30)."
            if [ "$attempt" -lt 30 ]; then sleep 15; fi
          done
          echo "::error::Production commit could not be verified. Check Render deploy history, branch, hook/auto-deploy, Cloudflare and site reachability."
          exit 1
