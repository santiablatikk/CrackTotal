name: Verify Arena 5.2 staging

# Never alters production. Connect the existing staging service to the
# development branch before running.
on:
  workflow_dispatch:
    inputs:
      trigger_deploy:
        description: 'Trigger the existing Render staging Deploy Hook'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact development commit
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate multiplayer games
        run: |
          npm ci
          npm test
      - name: Optionally trigger existing Render staging Deploy Hook
        if: \${{ inputs.trigger_deploy == true }}
        env:
          RENDER_STAGING_DEPLOY_HOOK: \${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "\${RENDER_STAGING_DEPLOY_HOOK:-}" ]; then
            echo "::error::Add RENDER_STAGING_DEPLOY_HOOK for cracktotal-arena-staging only."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$RENDER_STAGING_DEPLOY_HOOK" >/dev/null
      - name: Verify real Render commit and Arena 5.2 capabilities
        env:
          EXPECTED_SHA: \${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://cracktotal-arena-staging.onrender.com/__ct_staging/health"
          for attempt in $(seq 1 45); do
            response="$(curl --fail --silent --show-error --max-time 12 \
              "\${url}?sha=\${EXPECTED_SHA}" 2>/dev/null || true)"
            if printf '%s' "$response" | jq -e --arg sha "$EXPECTED_SHA" \
              '.ok == true and .service == "cracktotal-arena-staging" and
                .arenaProtocol == "cracktotal-arena-5.2" and
                .features.qsmResume == true and
                .features.mentirosoObjective == true and
                .contentVersions.mentiroso == "2026-10-21-objective-20min-2" and
                .branch == "redesign/crack-total-2" and .commit == $sha' >/dev/null 2>&1; then
              echo "Verified exact Arena staging commit: $EXPECTED_SHA"
              exit 0
            fi
            echo "Arena staging not yet at expected protocol/commit ($attempt/45)"
            if [ "$attempt" -lt 45 ]; then sleep 15; fi
          done
          echo "::error::Render does not serve Arena 5.2 at the expected SHA. Inspect the staging service branch, environment, build command and logs."
          exit 1
