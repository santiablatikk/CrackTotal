# Isolated test backend. Import as a NEW Render Blueprint, using this custom path.
# Never replace or sync the production root render.yaml.
services:
  - type: web
    name: cracktotal-arena-staging
    runtime: node
    plan: free
    region: frankfurt
    repo: https://github.com/santiablatikk/CrackTotal
    branch: redesign/crack-total-2
    autoDeployTrigger: "off"
    buildCommand: npm ci && npm test
    startCommand: npm start
    healthCheckPath: /__ct_staging/health
    envVars:
      - key: CT_STAGING
        value: "true"
      - key: CT_STAGING_ORIGINS
        value: https://deploy-preview-1--zingy-haupia-53b742.netlify.app
      - key: NODE_ENV
        value: staging
