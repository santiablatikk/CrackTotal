# Mirror of root render.yaml for docs/config reference.
# Source of truth for Blueprint: /render.yaml
services:
  - type: web
    name: cracktotal
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
    domains:
      - cracktotal.com
    headers:
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /*.html
        name: Cache-Control
        value: "no-cache"
      - path: /
        name: Cache-Control
        value: "no-cache"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    redirects:
      - source: /index.html
        destination: /
        type: permanent
      - source: www.cracktotal.com/*
        destination: https://cracktotal.com/:splat
        type: permanent
