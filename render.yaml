# Crack Total — historical Render Blueprint (not the active production service)
# LIVE: Render Static Site srv-d06n6p2li9vc73ei37m0, branch main, build npm run build, publish path '.'
# DO NOT apply this Node web-service blueprint to existing production without reviewing the service mismatch.
# Live site: https://cracktotal.com (Render + Cloudflare)
# Auto-deploy: connect this repo in Render with Auto-Deploy on `main`,
# or set GitHub secret RENDER_DEPLOY_HOOK (Deploy Hook URL from Render).
services:
  - type: web
    name: cracktotal
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
    domains:
      - cracktotal.com
    headers:
      - path: /sw.js
        name: Cache-Control
        value: "no-cache, no-store, must-revalidate"
      - path: /*.html
        name: Cache-Control
        value: "no-cache"
      - path: /
        name: Cache-Control
        value: "no-cache"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    redirects:
      - source: /index.html
        destination: /
        type: permanent
      - source: www.cracktotal.com/*
        destination: https://cracktotal.com/:splat
        type: permanent
