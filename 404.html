<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | Crack Total</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/portada.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --panel: #0b1524;
            --text: #f4f7fb;
            --muted: #aebbd0;
            --accent: #79f2a6;
            --line: rgba(255,255,255,.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Montserrat, system-ui, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(121,242,166,.16), transparent 32%),
                linear-gradient(160deg, #07111f 0%, #0b1524 55%, #102038 100%);
            padding: 24px;
        }
        .box {
            width: min(560px, 100%);
            padding: 2.25rem 1.75rem;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: rgba(11,21,36,.72);
            text-align: center;
        }
        .code {
            margin: 0;
            font-family: Oswald, sans-serif;
            font-size: clamp(4rem, 16vw, 6.5rem);
            letter-spacing: .04em;
            color: var(--accent);
            line-height: 1;
        }
        h1 {
            margin: .75rem 0 .5rem;
            font-family: Oswald, sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
        }
        p { margin: 0 0 1.25rem; color: var(--muted); line-height: 1.55; }
        .actions { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: .7rem 1.1rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            font-size: .92rem;
        }
        .primary { background: var(--accent); color: #04120a; }
        .secondary { border: 1px solid var(--line); color: var(--text); }
    </style>
</head>
<body>
    <main class="box">
        <p class="code" aria-hidden="true">404</p>
        <h1>No encontramos esa página</h1>
        <p>Puede que el link esté viejo o que la URL esté mal escrita. Volvé al inicio o elegí un juego.</p>
        <div class="actions">
            <a class="primary" href="/">Inicio</a>
            <a class="secondary" href="/games.html">Juegos</a>
            <a class="secondary" href="/blog.html">Actualidad</a>
        </div>
    </main>
</body>
</html>
