# Crack Total's production app remains unchanged. This file creates a
# static-only preview for unmerged design PRs on Netlify.
[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "node validate-deploy.js && npm test && node scripts/build-netlify-preview.cjs"
  publish = "public"

# Retired mode: preserve legacy bookmarks without publishing its source/assets.
[[redirects]]
  from = "/mi-carrera.html"
  to = "/games.html"
  status = 301

[[redirects]]
  from = "/mi-carrera"
  to = "/games.html"
  status = 301

# Editorial content withdrawn from this release
[[redirects]]
  from = "/blog-detail-futbol-femenino.html"
  to = "/blog.html"
  status = 301
