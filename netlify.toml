# Crack Total's production app remains unchanged. This file creates a
# static-only preview for unmerged design PRs on Netlify.
[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[context.deploy-preview]
  command = "node validate-deploy.js && node scripts/build-netlify-preview.cjs"
  publish = "public"
